name: mt32-pi CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create and publish (golem-1.0.0)
        required: true

permissions:
  contents: write

env:
  toolchain-version: 11.3.rel1
  python-version: 3.11

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4.5.0
        with:
          python-version: ${{ env.python-version }}

      - uses: psf/black@stable
        with:
          options: --check --diff --preview
          src: scripts

      - uses: isort/isort-action@master
        with:
            sortPaths: scripts

      - uses: py-actions/flake8@v2
        with:
          path: scripts

      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Golem protocol vectors
        run: python3 tests/test_golem_protocol.py

      - name: USB MIDI encoder
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_usbmidiencoder.cpp -o test_usbmidiencoder
          ./test_usbmidiencoder

      - name: Loudness limiter
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_loudness.cpp -o test_loudness
          ./test_loudness

      - name: Fade around a synth's own cut (MT-32 reset, new OPL3 player)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_declick.cpp -o test_declick
          ./test_declick

      - name: PWM output (oversampling, dither, exact levels)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -Iinclude tests/test_pwmoutput.cpp -o test_pwmoutput
          ./test_pwmoutput

      - name: Next audio input (I2S from the Next, ring buffer)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/test_nextaudiomix.cpp -o test_nextaudiomix
          ./test_nextaudiomix

      - name: OPL3 (libADLMIDI as the kernel builds it)
        run: |
          git submodule update --init --depth 1 external/libadlmidi
          CFLAGS=-DDOSBOX_NO_MUTEX CXXFLAGS=-DDOSBOX_NO_MUTEX cmake -S external/libadlmidi -B build-adlmidi-host \
            -DCMAKE_BUILD_TYPE=Release -DlibADLMIDI_STATIC=ON -DlibADLMIDI_SHARED=OFF -DENABLE_FPIC=OFF \
            -DWITH_MIDI_SEQUENCER=OFF -DWITH_EMBEDDED_BANKS=ON -DBUILD_NO_GREY_BANKS=ON -DWITH_XMI_SUPPORT=OFF \
            -DWITH_HQ_RESAMPLER=OFF -DUSE_NUKED_EMULATOR=ON -DUSE_DOSBOX_EMULATOR=ON -DUSE_OPAL_EMULATOR=OFF \
            -DUSE_JAVA_EMULATOR=OFF -DUSE_ESFMU_EMULATOR=OFF -DUSE_MAME_EMULATOR=OFF -DUSE_YMFM_EMULATOR=OFF \
            -DUSE_NUKED_OPL2_LLE_EMULATOR=OFF -DUSE_NUKED_OPL3_LLE_EMULATOR=OFF -DUSE_HW_SERIAL=OFF >/dev/null
          cmake --build build-adlmidi-host --target ADLMIDI_static -j
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude -Iexternal/libadlmidi/include tests/test_opl3midi.cpp \
            build-adlmidi-host/libADLMIDI.a -o test_opl3midi
          ./test_opl3midi

  build:
    runs-on: ubuntu-latest
    name: build-${{ matrix.board }}
    strategy:
      fail-fast: false
      matrix:
        board: [pi2, pi3-64, pi4-64]
    steps:
    - uses: actions/checkout@v3

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

    - name: Fetch submodules
      run: make submodules

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ env.toolchain-version }}-${{ matrix.board }}

    - name: Cache ARM toolchains
      id: cache-toolchains
      uses: actions/cache@v3
      with:
        path: |
          ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-arm-none-eabi
          ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-aarch64-none-elf
        key: cache-arm-toolchains-${{ env.toolchain-version }}

    - name: Install toolchains if not retrieved from cache
      if: steps.cache-toolchains.outputs.cache-hit != 'true'
      run: |
        for triplet in arm-none-eabi aarch64-none-elf; do
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.toolchain-version }}/binrel/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz
          tar -xf arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz -C ~
          rm arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}.tar.xz
        done

    - name: Update PATH
      run: |
        mkdir ~/ccache_bin
        for triplet in arm-none-eabi aarch64-none-elf; do
          ln -s $(which ccache) ~/ccache_bin/${triplet}-gcc
          ln -s $(which ccache) ~/ccache_bin/${triplet}-g++
          echo "$HOME/ccache_bin:$HOME/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}/bin" >> $GITHUB_PATH
        done

    - name: Build
      shell: bash
      run: |
        set +e
        make -j BOARD=${{ matrix.board }} 2>&1 | tee build.log
        status=${PIPESTATUS[0]}
        # Compiler errors as annotations, readable without the job log
        grep -E "error|Error [0-9]" build.log | head -20 | sed 's/^/::error::/'
        exit $status

    - name: Upload built kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernels-${{ matrix.board }}
        path: kernel*.img

    - name: Build (HDMI console)
      run: make clean && make -j BOARD=${{ matrix.board }} HDMI_CONSOLE=1

    - name: Upload built kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernels-hdmi-${{ matrix.board }}
        path: kernel*.img

  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/golem-') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      boot-home: external/circle-stdlib/libs/circle/boot
      wlan-home: external/circle-stdlib/libs/circle/addon/wlan

    steps:
    - uses: actions/checkout@v3

    - name: Fetch submodules
      run: make submodules

    - name: Cache boot files
      id: cache-boot-files
      uses: actions/cache@v3
      with:
        path: |
          sdcard/armstub8-rpi4.bin
          sdcard/bcm2711-rpi-4-b.dtb
          sdcard/bcm2711-rpi-400.dtb
          sdcard/bcm2711-rpi-cm4.dtb
          sdcard/bootcode.bin
          sdcard/COPYING.linux
          sdcard/fixup_cd.dat
          sdcard/fixup4cd.dat
          sdcard/LICENCE.broadcom
          sdcard/start_cd.elf
          sdcard/start4cd.elf
        key: cache-boot-files-${{ hashFiles(join(env.boot-home, '/Makefile')) }}

    - name: Cache WLAN firmware
      id: cache-wlan-firmware
      uses: actions/cache@v3
      with:
        path: sdcard/firmware
        key: cache-wlan-firmware-${{ hashFiles(join(env.wlan-home, '/firmware/Makefile')) }}

    - name: Cache ARM toolchains
      if: steps.cache-boot-files.outputs.cache-hit != 'true'
      uses: actions/cache@v3
      with:
        path: |
          ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-arm-none-eabi
          ~/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-aarch64-none-elf
        key: cache-arm-toolchains-${{ env.toolchain-version }}

    - name: Update PATH
      if: steps.cache-boot-files.outputs.cache-hit != 'true'
      run: |
        for triplet in arm-none-eabi aarch64-none-elf; do
          echo "$HOME/arm-gnu-toolchain-${{ env.toolchain-version }}-x86_64-${triplet}/bin" >> $GITHUB_PATH
        done

    - name: Download boot files and build ARM stub if not retrieved from cache
      if: steps.cache-boot-files.outputs.cache-hit != 'true'
      run: |
        make -C ${{ env.boot-home }} firmware armstub64
        cp  ${{ env.boot-home }}/armstub8-rpi4.bin \
            ${{ env.boot-home }}/bcm2711-rpi-4-b.dtb \
            ${{ env.boot-home }}/bcm2711-rpi-400.dtb \
            ${{ env.boot-home }}/bcm2711-rpi-cm4.dtb \
            ${{ env.boot-home }}/bootcode.bin \
            ${{ env.boot-home }}/COPYING.linux \
            ${{ env.boot-home }}/fixup_cd.dat \
            ${{ env.boot-home }}/fixup4cd.dat \
            ${{ env.boot-home }}/LICENCE.broadcom \
            ${{ env.boot-home }}/start_cd.elf \
            ${{ env.boot-home }}/start4cd.elf \
            sdcard

    - name: Download WLAN firmware if not retrieved from cache
      if: steps.cache-wlan-firmware.outputs.cache-hit != 'true'
      run: |
        mkdir -p sdcard/firmware
        make -C ${{ env.wlan-home }}/firmware
        cp  ${{ env.wlan-home }}/firmware/LICENCE.broadcom_bcm43xx \
            ${{ env.wlan-home }}/firmware/brcmfmac43430-sdio.bin \
            ${{ env.wlan-home }}/firmware/brcmfmac43430-sdio.txt \
            ${{ env.wlan-home }}/firmware/brcmfmac43436-sdio.bin \
            ${{ env.wlan-home }}/firmware/brcmfmac43436-sdio.txt \
            ${{ env.wlan-home }}/firmware/brcmfmac43436-sdio.clm_blob \
            ${{ env.wlan-home }}/firmware/brcmfmac43455-sdio.bin \
            ${{ env.wlan-home }}/firmware/brcmfmac43455-sdio.txt \
            ${{ env.wlan-home }}/firmware/brcmfmac43455-sdio.clm_blob \
            ${{ env.wlan-home }}/firmware/brcmfmac43456-sdio.bin \
            ${{ env.wlan-home }}/firmware/brcmfmac43456-sdio.txt \
            ${{ env.wlan-home }}/firmware/brcmfmac43456-sdio.clm_blob \
            sdcard/firmware

    - name: Retrieve built kernels (one artifact per board)
      uses: actions/download-artifact@v4
      with:
        pattern: kernels-pi*
        merge-multiple: true
        path: sdcard

    - name: Check that every board has its kernel
      run: |
        ls -l sdcard/kernel*.img
        for k in kernel7.img kernel8.img kernel8-rpi4.img; do test -f "sdcard/$k" || { echo "missing $k"; exit 1; }; done

    # GeneralUser GS, the SoundFont the card ships with (free to
    # redistribute; its licence goes in docs/). From its author's GitHub
    # repository: the Google Drive download it used before failed silently
    # and golem-1.2.0 shipped without it. A missing SoundFont now stops the
    # package.
    - name: Get GeneralUser GS SoundFont
      run: |
        git clone --depth 1 https://github.com/mrbumpy409/GeneralUser-GS.git gugs
        sf=$(find gugs -iname '*.sf2' | sort | head -1)
        test -n "$sf" || { echo "no .sf2 in GeneralUser-GS"; exit 1; }
        echo "SoundFont: $sf"
        echo "GUGS_SF=$sf" >> "$GITHUB_ENV"

    - name: Add extra files to SD card directory
      run: |
        mkdir sdcard/docs
        cp LICENSE sdcard/docs
        name=$(basename "$GUGS_SF" .sf2)
        cp "$GUGS_SF" sdcard/soundfonts/
        # The effects profile goes with the SoundFont's file name
        if [ "sdcard/soundfonts/$name.cfg" != "sdcard/soundfonts/GeneralUser GS v1.511.cfg" ]; then
          mv "sdcard/soundfonts/GeneralUser GS v1.511.cfg" "sdcard/soundfonts/$name.cfg"
        fi
        lic=$(find gugs -maxdepth 2 -iname 'licen[cs]e*' | head -1)
        test -n "$lic" && cp "$lic" sdcard/docs/LICENSE.GeneralUserGS
        ls -l sdcard/soundfonts
        cp README.md sdcard/docs

    - name: Upload SD card archive
      uses: actions/upload-artifact@v4
      with:
        name: sdcard
        path: sdcard

    - name: Get version (tag pushed or given to a manual run)
      id: get_version
      run: |
        tag="${{ inputs.tag }}"
        if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

    - name: Create release package
      if: steps.get_version.outputs.tag != ''
      run: cd sdcard; zip -r ../mt32-pi-${{ steps.get_version.outputs.version }}.zip *

    - name: Release notes (CHANGELOG entry of this tag)
      if: steps.get_version.outputs.tag != ''
      run: |
        awk -v t="${{ steps.get_version.outputs.tag }}" 'index($0, "## [" t "]") == 1 {p = 1; next} /^## \[/ {p = 0} p' CHANGELOG.md > notes.md
        test -s notes.md
        { echo; echo '### SHA-256'; echo '```'; sha256sum mt32-pi-*.zip; echo '```'; } >> notes.md

    - name: Release
      if: steps.get_version.outputs.tag != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ steps.get_version.outputs.tag }}" mt32-pi-*.zip --target "$GITHUB_SHA" --title "mt32-pi Golem fork ${{ steps.get_version.outputs.tag }}" --notes-file notes.md
