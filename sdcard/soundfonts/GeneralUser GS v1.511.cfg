# Based on the settings recommended for GeneralUser GS by its author, with a
# shorter reverb tail for the Golem (2026-10-21: room 0.7 and damping 0.19 left
# a tail of over 4 s; chosen by ear on hardware).
gain = 0.2

reverb = on
reverb_damping = 0.4
reverb_level = 0.4
reverb_room_size = 0.4
reverb_width = 0.75

chorus = on
chorus_depth = 4.5
chorus_level = 0.5
chorus_voices = 3
chorus_speed = 0.35
